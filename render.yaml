# Render Blueprint: creates the API and the React client in one step (the database is on Neon).
# Render dashboard: New -> Blueprint -> pick this repository -> Apply.
# No secrets here: the Neon connection string is entered in the Render dashboard and the JWT key is generated by Render.

services:
  # ---------- API: built from the Dockerfile in this repository ----------
  - type: web
    name: stagetix-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Neon gives a postgresql://... URL; PostgresConnectionString converts it for Npgsql.
      # sync: false = Render asks for the value when the Blueprint is created (it is never stored in Git).
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      # Must match the client's real address (no "/" at the end).
      - key: Cors__AllowedOrigins__0
        value: https://stagetix-client.onrender.com
      - key: Database__SeedDemoData
        value: "true"

  # ---------- Client: static React build from the client repository ----------
  - type: web
    name: stagetix-client
    runtime: static
    repo: https://github.com/b0504166110-lab/stagetix-client
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # React Router: every path is served by index.html, so refreshing /shows does not return 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked in at build time: after changing it, deploy the client again.
      - key: VITE_API_URL
        value: https://stagetix-server.onrender.com
