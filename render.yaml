# Render Blueprint: creates the database, the API and the React client in one step.
# Render dashboard: New -> Blueprint -> pick this repository -> Apply.
# No secrets here: the connection string comes from the database and the JWT key is generated by Render.

databases:
  - name: stagetix-db
    databaseName: stagetix
    user: stagetix
    plan: free
    region: frankfurt

services:
  # ---------- API: built from the Dockerfile in this repository ----------
  - type: web
    name: stagetix-server
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Render gives a postgresql://... URL; PostgresConnectionString converts it for Npgsql.
      - key: ConnectionStrings__Default
        fromDatabase:
          name: stagetix-db
          property: connectionString
      - key: Jwt__SigningKey
        generateValue: true
      # Must match the client's real address (no "/" at the end).
      - key: Cors__AllowedOrigins__0
        value: https://stagetix-client.onrender.com
      - key: Database__SeedDemoData
        value: "true"

  # ---------- Client: static React build from the client repository ----------
  - type: web
    name: stagetix-client
    runtime: static
    repo: https://github.com/b0504166110-lab/stagetix-client
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked in at build time: after changing it, deploy the client again.
      - key: VITE_API_URL
        value: https://stagetix-server.onrender.com
